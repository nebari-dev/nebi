version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:00"
      timezone: "US/Eastern"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:00"
      timezone: "US/Eastern"
    ignore:
      # Ignore all React updates
      - dependency-name: "react"
      - dependency-name: "react-dom"
      # Ignore Node 25+ updates
      - dependency-name: "@types/node"
        versions: [">=25"]
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
    groups:
      # Group all patch and minor updates into a single PR
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    # Major updates are not grouped, so each opens its own PR

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:00"
      timezone: "US/Eastern"
    groups:
      # Keep Astro docs packages together so compatible versions move in one PR
      astro-docs:
        applies-to: version-updates
        patterns:
          - "astro"
          - "astro-*"
          - "@astrojs/*"
          - "@nebari/starlight"
          - "starlight-*"
      # Group all patch and minor updates into a single PR
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    # Non-Astro major updates are not grouped, so each opens its own PR
