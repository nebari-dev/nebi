name: Desktop App

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

env:
  COSIGN_VERSION: v2.6.1
  SYFT_VERSION: v1.40.0
  GOVULNCHECK_VERSION: v1.1.4

# Serialize against the Release (GoReleaser) workflow, which fires on the same
# v* tags and writes to the same GitHub release. Sharing one ref-keyed group
# across both workflows means whichever starts first creates the release and
# the other only appends its assets — eliminating the concurrent-create race.
# cancel-in-progress: false so a queued run waits rather than being dropped.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: Nebi
            asset_name: nebi-desktop-linux-amd64
            build_tags: "-tags webkit2_41"
          - os: macos-latest
            platform: darwin/universal
            artifact: Nebi.app
            asset_name: nebi-desktop-macos-universal
            build_tags: ""
          - os: windows-latest
            platform: windows
            artifact: Nebi.exe
            asset_name: nebi-desktop-windows-amd64.exe
            build_tags: ""

    runs-on: ${{ matrix.os }}
    # macOS code-signing / notarization secrets. Surfaced as env so the signing
    # steps can be conditionally skipped (e.g. on fork PRs, where secrets are
    # empty) via `env.MACOS_SIGNING_CERT_B64 != ''`.
    env:
      MACOS_SIGNING_CERT_B64: ${{ secrets.MACOS_SIGNING_CERT_B64 }}
      MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      WINDOWS_SIGNING_CERT_B64: ${{ secrets.WINDOWS_SIGNING_CERT_B64 }}
      WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.24'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Validate macOS release signing inputs
        if: matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          for name in \
            MACOS_SIGNING_CERT_B64 \
            MACOS_SIGNING_CERT_PASSWORD \
            MACOS_SIGNING_IDENTITY \
            APPLE_API_KEY_B64 \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing required macOS signing input: ${name}"
              exit 1
            fi
          done

      - name: Validate Windows release signing inputs
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in "WINDOWS_SIGNING_CERT_B64", "WINDOWS_SIGNING_CERT_PASSWORD") {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing required Windows signing input: $name"
            }
          }

      # Linux dependencies for wails (Ubuntu 24.04 uses webkit2gtk-4.1).
      # xvfb is needed for the post-build smoke test below.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb

      - name: Build frontend
        shell: bash
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          rm -rf internal/web/dist
          cp -r frontend/dist internal/web/dist

      # Pin to the wails version in go.mod; unpinned installs broke when wails v2.13.0
      # started requiring a newer Go than this workflow uses.
      - name: Install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install release supply-chain tools
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go mod download
          go install "github.com/sigstore/cosign/v2/cmd/cosign@${COSIGN_VERSION}"
          go install "github.com/anchore/syft/cmd/syft@${SYFT_VERSION}"
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

      - name: Run Go vulnerability check
        if: startsWith(github.ref, 'refs/tags/')
        run: govulncheck ${{ matrix.build_tags }} ./...

      - name: Run frontend vulnerability check
        if: startsWith(github.ref, 'refs/tags/')
        run: cd frontend && npm audit --audit-level=high

      - name: Build desktop app
        run: wails build -s -platform ${{ matrix.platform }} ${{ matrix.build_tags }}

      # Import the Developer ID Application cert into a throwaway keychain so
      # codesign can use it. Skipped automatically when secrets are absent
      # (e.g. fork PRs), leaving the Wails ad-hoc signature in place.
      - name: Import signing certificate (macOS)
        if: matrix.os == 'macos-latest' && env.MACOS_SIGNING_CERT_B64 != ''
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          # The temp keychain is ephemeral (deleted with the runner), so its
          # password just needs to be non-empty — generate one rather than
          # require a secret.
          KEYCHAIN_PWD="$(uuidgen)"
          echo "$MACOS_SIGNING_CERT_B64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_SIGNING_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

      # Re-sign with the Developer ID cert under the hardened runtime (required
      # for notarization), replacing Wails' ad-hoc signature.
      - name: Sign macOS app
        if: matrix.os == 'macos-latest' && env.MACOS_SIGNING_CERT_B64 != ''
        run: |
          set -euo pipefail
          codesign --force --options runtime --timestamp \
            --entitlements build/darwin/entitlements.plist \
            --sign "$MACOS_SIGNING_IDENTITY" \
            build/bin/Nebi.app
          codesign --verify --deep --strict --verbose=2 build/bin/Nebi.app

      # Submit to Apple's notary service, wait for the verdict, then staple the
      # ticket onto the .app so Gatekeeper accepts it offline. notarytool needs
      # a zip to submit; the final distribution zip is rebuilt from the stapled
      # bundle by the "Package macOS app" step below.
      - name: Notarize macOS app
        if: matrix.os == 'macos-latest' && env.MACOS_SIGNING_CERT_B64 != ''
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/api_key.p8"
          echo "$APPLE_API_KEY_B64" | base64 --decode > "$KEY_PATH"
          ditto -c -k --keepParent build/bin/Nebi.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple build/bin/Nebi.app
          xcrun stapler validate build/bin/Nebi.app

      - name: Sign Windows app
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $certPath = Join-Path $env:RUNNER_TEMP "windows-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_B64))

          $kitsRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $signtoolPath = $null
          if (Test-Path $kitsRoot) {
            $signtoolPath = (Get-ChildItem $kitsRoot -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Select-Object -First 1).FullName
          }
          if (-not $signtoolPath) {
            $signtool = Get-Command signtool.exe -ErrorAction SilentlyContinue
            if ($signtool) {
              $signtoolPath = $signtool.Source
            }
          }
          if (-not $signtoolPath) {
            throw "signtool.exe not found"
          }

          & $signtoolPath sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certPath /p $env:WINDOWS_SIGNING_CERT_PASSWORD build/bin/Nebi.exe
          & $signtoolPath verify /pa /v build/bin/Nebi.exe

      # macOS .app bundles must be packaged into a single archive before they
      # leave the runner. Uploading the raw Nebi.app directory strips the
      # bundle wrapper (upload-artifact roots the archive at the dir's
      # contents, so it unzips to a bare Contents/ folder) and loses the
      # executable bit and symlinks. `ditto` is Apple's bundle-aware archiver:
      # it preserves the wrapper, permissions, symlinks, and xattrs so the
      # downloaded zip unzips to a launchable Nebi.app.
      - name: Package macOS app
        if: matrix.os == 'macos-latest'
        run: |
          cd build/bin
          ditto -c -k --keepParent Nebi.app ${{ matrix.asset_name }}.zip

      # For PRs and main branch pushes: upload as artifacts
      - name: Upload artifact (Linux)
        if: matrix.os == 'ubuntu-latest' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nebi-linux
          path: build/bin/Nebi

      - name: Upload artifact (macOS)
        if: matrix.os == 'macos-latest' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nebi-macos
          path: build/bin/${{ matrix.asset_name }}.zip

      - name: Upload artifact (Windows)
        if: matrix.os == 'windows-latest' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nebi-windows
          path: build/bin/Nebi.exe

      # Smoke test: launch the built binary and confirm it doesn't crash within
      # 10s. Catches runtime regressions a build-only step misses — e.g. the
      # WebKitGTK/JSC signal-handler SIGSEGV fixed in #351, which only triggers
      # once the JS context lazy-inits at runtime.
      - name: Smoke test (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set +e
          xvfb-run -a timeout 10 ./build/bin/Nebi
          code=$?
          set -e
          # `timeout` exits 124 when it kills the still-running process, which
          # is the success case here — the GUI is expected to stay alive.
          if [ "$code" -ne 124 ]; then
            echo "Smoke test failed: binary exited with code $code within 10s (expected 124)"
            exit 1
          fi
          echo "Smoke test passed: binary stayed alive for 10s"

      - name: Smoke test (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          open ./build/bin/Nebi.app
          sleep 10
          if pgrep -x Nebi > /dev/null; then
            echo "Smoke test passed: binary stayed alive for 10s"
            pkill -x Nebi || true
          else
            echo "Smoke test failed: Nebi.app exited or crashed within 10s"
            exit 1
          fi

      - name: Smoke test (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "build/bin/Nebi.exe" -PassThru
          Start-Sleep -Seconds 10
          if (-not $proc.HasExited) {
            Write-Host "Smoke test passed: binary stayed alive for 10s"
            Stop-Process -Id $proc.Id
          } else {
            Write-Host "Smoke test failed: exited with code $($proc.ExitCode) within 10s"
            exit 1
          }

      # For releases: compress and upload to GitHub release
      - name: Compress for release (Linux)
        if: matrix.os == 'ubuntu-latest' && startsWith(github.ref, 'refs/tags/')
        run: |
          cd build/bin
          tar -czvf ${{ matrix.asset_name }}.tar.gz Nebi

      - name: Rename for release (Windows)
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Copy-Item "build/bin/Nebi.exe" "build/bin/${{ matrix.asset_name }}"

      - name: Select release asset
        if: startsWith(github.ref, 'refs/tags/')
        id: release_asset
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest)
              asset_path="build/bin/${{ matrix.asset_name }}.tar.gz"
              ;;
            macos-latest)
              asset_path="build/bin/${{ matrix.asset_name }}.zip"
              ;;
            windows-latest)
              asset_path="build/bin/${{ matrix.asset_name }}"
              ;;
            *)
              echo "Unsupported release OS: ${{ matrix.os }}"
              exit 1
              ;;
          esac
          echo "path=${asset_path}" >> "$GITHUB_OUTPUT"
          echo "sbom_path=${asset_path}.sbom.spdx.json" >> "$GITHUB_OUTPUT"

      - name: Generate release SBOM and signatures
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          asset_path="${{ steps.release_asset.outputs.path }}"
          asset_dir="$(dirname "$asset_path")"
          asset_name="$(basename "$asset_path")"

          cd "$asset_dir"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset_name" > "${asset_name}.sha256"
          else
            shasum -a 256 "$asset_name" > "${asset_name}.sha256"
          fi
          syft "$asset_name" -o "spdx-json=${asset_name}.sbom.spdx.json"
          cosign sign-blob --bundle="${asset_name}.sigstore.json" "$asset_name" --yes
          cosign sign-blob --bundle="${asset_name}.sbom.spdx.json.sigstore.json" "${asset_name}.sbom.spdx.json" --yes

          sha256_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | awk '{print $1}'
            else
              shasum -a 256 "$1" | awk '{print $1}'
            fi
          }
          asset_sha256="$(sha256_file "$asset_name")"
          sbom_sha256="$(sha256_file "${asset_name}.sbom.spdx.json")"
          cat > "${asset_name}.release.json" <<EOF
          {
            "component": "desktop",
            "asset": "${asset_name}",
            "source_commit": "${GITHUB_SHA}",
            "workflow": "${GITHUB_WORKFLOW}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "artifact_sha256": "${asset_sha256}",
            "sbom_sha256": "${sbom_sha256}"
          }
          EOF
          cosign sign-blob --bundle="${asset_name}.release.json.sigstore.json" "${asset_name}.release.json" --yes

      - name: Attest desktop release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: ${{ steps.release_asset.outputs.path }}
          create-storage-record: false

      - name: Attest desktop SBOM
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: ${{ steps.release_asset.outputs.path }}
          sbom-path: ${{ steps.release_asset.outputs.sbom_path }}
          create-storage-record: false

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.release_asset.outputs.path }}
            ${{ steps.release_asset.outputs.path }}.sha256
            ${{ steps.release_asset.outputs.path }}.sigstore.json
            ${{ steps.release_asset.outputs.sbom_path }}
            ${{ steps.release_asset.outputs.sbom_path }}.sigstore.json
            ${{ steps.release_asset.outputs.path }}.release.json
            ${{ steps.release_asset.outputs.path }}.release.json.sigstore.json

      - name: Publish release when all gated assets are current
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish-release-if-ready.sh
