name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  CF_PROJECT: nebi

jobs:
  docs:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: docs

      - name: Compute site and deploy branch
        id: site
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "site=https://nebi.nebari.dev" >> "$GITHUB_OUTPUT"
            echo "base=/" >> "$GITHUB_OUTPUT"
            echo "branch=main" >> "$GITHUB_OUTPUT"
          else
            ALIAS=$(printf '%s' "$HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')
            echo "site=https://${ALIAS}.${CF_PROJECT}.pages.dev" >> "$GITHUB_OUTPUT"
            echo "base=/" >> "$GITHUB_OUTPUT"
            echo "branch=${HEAD_REF}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: npm run build
        working-directory: docs
        env:
          SITE: ${{ steps.site.outputs.site }}
          BASE: ${{ steps.site.outputs.base }}

      - name: Determine deployability
        id: candeploy
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          OK=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ -z "${CF_TOKEN}" ] || [ -z "${CF_ACCOUNT}" ] || [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              OK=false
              echo "::notice::Cloudflare secrets unavailable; skipping preview deploy (build still gates)."
            fi
          fi
          echo "ok=${OK}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: ${{ steps.candeploy.outputs.ok == 'true' }}
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: npx wrangler pages project create ${{ env.CF_PROJECT }} --production-branch=main || true
          command: pages deploy docs/dist --project-name=${{ env.CF_PROJECT }} --branch=${{ steps.site.outputs.branch }}

      - name: Comment preview URL
        if: ${{ github.event_name == 'pull_request' && steps.deploy.outcome == 'success' }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: docs-preview
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          message: |
            **Docs preview** for `${{ github.event.pull_request.head.ref }}`:
            ${{ steps.deploy.outputs.pages-deployment-alias-url }}
