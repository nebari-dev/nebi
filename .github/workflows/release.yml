name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

# Keep Release runs for a ref mutually exclusive. Docker/Desktop use their own
# concurrency groups and wait for this workflow before uploading release assets.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Blocks the release when the pinned Go toolchain is unsupported or behind
  # on security patches, or when code reachable from the shipped packages
  # calls a known-vulnerable symbol (#451).
  vuln-gate:
    name: Vulnerability Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Load pinned tool versions
        run: bash .github/scripts/load-tool-versions.sh

      - name: Check Go toolchain is current (strict)
        run: ./scripts/check-go-toolchain.sh --strict

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'

      - name: govulncheck (source)
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck ./cmd/... ./internal/...

  goreleaser:
    needs: vuln-gate
    runs-on: ubuntu-latest
    # macOS signing/notarization credentials for the `notarize` block in
    # .goreleaser.yaml. These reuse the Developer ID cert + App Store Connect
    # API key already configured for the Desktop App workflow (desktop.yml).
    # Tagged releases validate these below and fail closed if any are missing.
    # Snapshot builds that reuse .goreleaser.yaml still skip notarization.
    env:
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGNING_CERT_B64 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
      MACOS_NOTARY_KEY: ${{ secrets.APPLE_API_KEY_B64 }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Load pinned tool versions
        id: tool_versions
        run: bash .github/scripts/load-tool-versions.sh

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Validate release signing inputs
        run: |
          set -euo pipefail
          for name in \
            MACOS_SIGN_P12 \
            MACOS_SIGN_PASSWORD \
            MACOS_NOTARY_KEY \
            MACOS_NOTARY_KEY_ID \
            MACOS_NOTARY_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing required release signing input: ${name}"
              exit 1
            fi
          done

      - name: Run frontend vulnerability check
        run: cd frontend && npm audit --audit-level=high

      - name: Install build tools
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go mod download
          go install "github.com/swaggo/swag/cmd/swag@${SWAG_VERSION}"
          go install "github.com/sigstore/cosign/v2/cmd/cosign@${COSIGN_VERSION}"
          go install "github.com/anchore/syft/cmd/syft@${SYFT_VERSION}"
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

      - name: Run Go vulnerability check
        run: govulncheck ./cmd/... ./internal/...

      - name: Generate Swagger docs
        run: make swagger

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: ${{ steps.tool_versions.outputs.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest CLI release artifacts
        id: attest_cli
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # pinned commit
        with:
          subject-checksums: ./dist/checksums.txt
          create-storage-record: false

      - name: Prepare CLI release gate assets
        shell: bash
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest_cli.outputs.bundle-path }}
        run: |
          set -euo pipefail
          if [ -z "${ATTESTATION_BUNDLE}" ]; then
            echo "actions/attest did not return a CLI attestation bundle path."
            exit 1
          fi
          cp "${ATTESTATION_BUNDLE}" nebi-cli-provenance.sigstore.json

          checksums_sha256="$(sha256sum dist/checksums.txt | awk '{print $1}')"
          cat > nebi-cli-release.json <<EOF
          {
            "component": "cli",
            "source_commit": "${GITHUB_SHA}",
            "workflow": "${GITHUB_WORKFLOW}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "checksums_sha256": "${checksums_sha256}",
            "provenance_bundle": "nebi-cli-provenance.sigstore.json"
          }
          EOF
          cosign sign-blob --bundle=nebi-cli-release.json.sigstore.json nebi-cli-release.json --yes

      - name: Upload CLI release gate assets
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            nebi-cli-provenance.sigstore.json
            nebi-cli-release.json
            nebi-cli-release.json.sigstore.json

      - name: Publish release when all gated assets are current
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish-release-if-ready.sh
