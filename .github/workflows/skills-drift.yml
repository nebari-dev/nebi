name: Agent skills drift

# The vendored nebari-ui agent skill is upstream-managed. Flag when it falls
# behind nebari-design so agents don't build against stale guidance.
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nebari-ui-skill:
    name: nebari-ui skill matches upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check vendored skill
        run: ./scripts/sync-nebari-ui-skill.sh --check
        working-directory: frontend
