# Nebi Configuration File
# This is an example configuration for local development

server:
  port: 8460
  mode: development  # "development" or "production"

database:
  driver: sqlite  # "sqlite" or "postgres"
  dsn: ./nebi.db  # For SQLite: file path, For Postgres: connection string
  # Example Postgres DSN: "host=localhost user=nebi password=secret dbname=nebi port=5432 sslmode=disable"

auth:
  # Local development runs without authentication: every request is an
  # implicit admin. Set type: oidc plus oidc_issuer_url and oidc_client_id to
  # sign in through an identity provider (see config.yaml.example).
  type: none
  jwt_secret: dev-secret-that-is-at-least-32-chars-long

log:
  format: text  # "text" or "json"
  level: info   # "debug", "info", "warn", "error"

# pixi_path: /custom/path/to/pixi  # Optional: Custom pixi binary path

storage:
  projects_dir: ./data/projects  # Directory where projects are stored
  # For production, consider: /var/lib/nebi/projects
