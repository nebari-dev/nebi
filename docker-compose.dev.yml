services:
  nebi-server:
    build:
      context: .
      target: nebi-server
    container_name: nebi-team-dev
    stop_grace_period: 45s
    ports:
      - "8470:8460"
    environment:
      NEBI_DATABASE_DSN: /app/data/nebi-team.db
      NEBI_AUTH_JWT_SECRET: dev-secret-that-is-at-least-32-chars-long
      # Development only: no authentication, every request is an admin. See
      # docker-compose.yml for a deployment with Keycloak.
      NEBI_AUTH_TYPE: none
    volumes:
      - nebi_team_data:/app/data

volumes:
  nebi_team_data:
