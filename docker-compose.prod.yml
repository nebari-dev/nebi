services:
  # Traefik - Reverse Proxy with automatic HTTPS via Let's Encrypt
  traefik:
    image: docker.io/library/traefik@sha256:c5bd185c41ba3dbb42cf8a1b9fbdc368bdc96f90c8e598134879935f64e7a7f1
    container_name: nebi-traefik
    command:
      # API and dashboard (disable in production)
      - --api.insecure=false
      # Docker provider
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # Entrypoints
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # HTTP to HTTPS redirect
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      # Let's Encrypt configuration
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.caserver=https://acme-v02.api.letsencrypt.org/directory
      # Logging
      - --log.level=DEBUG
      - --accesslog=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt-data:/letsencrypt
    networks:
      - nebi-network
    restart: unless-stopped

  # PostgreSQL 18 - Database
  postgres:
    image: docker.io/library/postgres@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    container_name: nebi-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nebi}
      POSTGRES_USER: ${POSTGRES_USER:-nebi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nebi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nebi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nebi API with an in-process worker
  # NOTE: Before first deployment, set permissions:
  #   mkdir -p ./data/projects
  #   chown -R 65532:65532 ./data/projects
  # Override NEBI_IMAGE with an immutable digest reference for newer releases.
  nebi-api:
    image: ${NEBI_IMAGE:-quay.io/nebari/nebi@sha256:56f384dfca063c37feb2fd0310afad8b9cd16baed7c6e63b541caf62db60678b}
    container_name: nebi-api
    env_file:
      - .env.prod
    environment:
      # Database configuration
      NEBI_DATABASE_DRIVER: postgres
      NEBI_DATABASE_DSN: postgres://${POSTGRES_USER:-nebi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nebi}?sslmode=disable
      NEBI_DATABASE_MAX_IDLE_CONNS: 10
      NEBI_DATABASE_MAX_OPEN_CONNS: 100
      NEBI_DATABASE_CONN_MAX_LIFETIME: 60
      # Server configuration
      NEBI_SERVER_PORT: 8460
      NEBI_SERVER_MODE: production
      # Logging
      NEBI_LOG_LEVEL: info
      NEBI_LOG_FORMAT: json
      NEBI_STORAGE_PROJECTS_DIR: /app/data/projects
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nebi.rule=Host(`${NEBI_DOMAIN}`)"
      - "traefik.http.routers.nebi.entrypoints=websecure"
      - "traefik.http.routers.nebi.tls=true"
      - "traefik.http.routers.nebi.tls.certresolver=letsencrypt"
      - "traefik.http.services.nebi.loadbalancer.server.port=8460"
    expose:
      - "8460"
    volumes:
      - ./data/projects:/app/data/projects
    networks:
      - nebi-network
    depends_on:
      postgres:
        condition: service_healthy
      traefik:
        condition: service_started
    restart: unless-stopped
    # Health check removed - distroless image has no wget/curl
    # Traefik monitors service health directly

volumes:
  letsencrypt-data:
    driver: local
  postgres_data:
    driver: local

networks:
  nebi-network:
    name: nebi-network
    driver: bridge
